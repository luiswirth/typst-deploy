name: Reusable Typst Deploy

on:
  workflow_call:
    inputs:
      documents:
        description: >
          The documents to compile, one per line, each a Typst file and
          optionally the name it is published under. The name defaults to the
          file's own with a pdf extension. One document is served at the site's
          URL itself, several are listed there.
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Checkout typst-deploy (fonts)
        uses: actions/checkout@v6
        with:
          repository: luiswirth/typst-deploy
          path: typst-deploy-assets

      - uses: cachix/install-nix-action@v31

      # The document's own devShell carries both the Typst it is written for
      # and the libraries it imports, so a deployment compiles it the way its
      # author does.
      - name: Compile Typst
        env:
          DOCUMENTS: ${{ inputs.documents }}
        run: |
          mkdir public
          # Read from a file rather than a pipe, so a failing compile fails the
          # job instead of a subshell.
          printf '%s\n' "$DOCUMENTS" > documents.list
          nix develop --command sh -euc '
            while read -r entry name; do
              [ -n "$entry" ] || continue
              name=${name:-$(basename "${entry%.typ}").pdf}
              typst compile "$entry" "public/$name" \
                --font-path typst-deploy-assets/fonts \
                --root .
            done < documents.list
          '

      # One document is redirected to, so that the URL is the document.
      - name: Create Landing Page
        run: |
          set -- public/*.pdf
          if [ $# -eq 1 ]; then
            printf '/ /%s 302\n' "$(basename "$1")" > public/_redirects
          else
            {
              printf '<!DOCTYPE html><meta charset="utf-8"><title>%s</title>\n' \
                "$GITHUB_REPOSITORY"
              printf '<h1>%s</h1><ul>\n' "$GITHUB_REPOSITORY"
              for pdf; do
                printf '<li><a href="%s">%s</a></li>\n' \
                  "$(basename "$pdf")" "$(basename "$pdf")"
              done
              printf '</ul>\n'
            } > public/index.html
          fi

      # The Cloudflare Pages project is named after the repository.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy public
            --project-name=${{ github.event.repository.name }}
            --branch=main
