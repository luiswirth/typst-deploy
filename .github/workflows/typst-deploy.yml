name: Reusable Typst Deploy

on:
  workflow_call:
    inputs:
      entry_file:
        required: true
        type: string
      output_name:
        required: false
        type: string
        default: document.pdf

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout typst-deploy (fonts)
        uses: actions/checkout@v4
        with:
          repository: luiswirth/typst-deploy
          path: typst-deploy-assets

      - uses: typst-community/setup-typst@v3

      - name: Compile Typst
        run: |
          mkdir public
          typst compile ${{ inputs.entry_file }} public/${{ inputs.output_name }} \
            --font-path typst-deploy-assets/fonts \
            --root . \
            2>&1 | tee compile.log

      - name: Create Landing Page
        run: |
          echo "<!DOCTYPE html><meta http-equiv=\"refresh\" content=\"0; url=${{ inputs.output_name }}\">" > public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
