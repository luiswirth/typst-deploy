name: Reusable Typst Deploy

on:
  workflow_call:
    inputs:
      documents:
        description: >
          The documents to compile, one per line, each a Typst file and
          optionally the name it is published under. The name defaults to the
          file's own with a pdf extension. One document is served at the Pages
          URL itself, several are listed there.
        required: true
        type: string
      package_path:
        description: >
          Repository-relative path to a Typst local package root, the directory
          holding local/<name>/<version>. A repository that vendors its library
          as a submodule points here, and @local imports resolve against it.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive

      - name: Checkout typst-deploy (fonts)
        uses: actions/checkout@v6
        with:
          repository: luiswirth/typst-deploy
          path: typst-deploy-assets

      - uses: typst-community/setup-typst@v5

      - name: Compile Typst
        env:
          DOCUMENTS: ${{ inputs.documents }}
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: |
          mkdir public
          if [ -n "$PACKAGE_PATH" ]; then
            export TYPST_PACKAGE_PATH="$PWD/$PACKAGE_PATH"
          fi
          # Read from a file rather than a pipe, so a failing compile fails the
          # job instead of a subshell.
          printf '%s\n' "$DOCUMENTS" > documents.list
          while read -r entry name; do
            [ -n "$entry" ] || continue
            name=${name:-$(basename "${entry%.typ}").pdf}
            typst compile "$entry" "public/$name" \
              --font-path typst-deploy-assets/fonts \
              --root .
          done < documents.list

      - name: Create Landing Page
        run: |
          set -- public/*.pdf
          if [ $# -eq 1 ]; then
            printf '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=%s">\n' \
              "$(basename "$1")" > public/index.html
          else
            {
              printf '<!DOCTYPE html><meta charset="utf-8"><title>%s</title>\n' \
                "$GITHUB_REPOSITORY"
              printf '<h1>%s</h1><ul>\n' "$GITHUB_REPOSITORY"
              for pdf; do
                printf '<li><a href="%s">%s</a></li>\n' \
                  "$(basename "$pdf")" "$(basename "$pdf")"
              done
              printf '</ul>\n'
            } > public/index.html
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
