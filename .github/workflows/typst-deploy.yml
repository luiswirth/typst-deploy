name: Reusable Typst Deploy

on:
  workflow_call:
    inputs:
      entry_file:
        required: true
        type: string
      output_name:
        required: false
        type: string
        default: document.pdf
      package_path:
        description: >
          Repository-relative path to a Typst local package root, the directory
          holding local/<name>/<version>. A repository that vendors its library
          as a submodule points here, and @local imports resolve against it.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive

      - name: Checkout typst-deploy (fonts)
        uses: actions/checkout@v6
        with:
          repository: luiswirth/typst-deploy
          path: typst-deploy-assets

      - uses: typst-community/setup-typst@v5

      - name: Compile Typst
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: |
          mkdir public
          if [ -n "$PACKAGE_PATH" ]; then
            export TYPST_PACKAGE_PATH="$PWD/$PACKAGE_PATH"
          fi
          typst compile ${{ inputs.entry_file }} public/${{ inputs.output_name }} \
            --font-path typst-deploy-assets/fonts \
            --root . \
            2>&1 | tee compile.log

      - name: Create Landing Page
        run: |
          echo "<!DOCTYPE html><meta http-equiv=\"refresh\" content=\"0; url=${{ inputs.output_name }}\">" > public/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
